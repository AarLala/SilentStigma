# SilenceVoice Dashboard Configuration

# Dashboard Settings
dashboard:
  host: "127.0.0.1"
  port: 5000
  debug: false
  max_results_display: 1000

# Database (for backward compatibility - dashboard uses Supabase)
database:
  path: "data/silencevoice.db"
  backup_enabled: true

# Ethical Safeguards
safeguards:
  aggregate_only: true
  no_individual_tracking: true
  no_diagnosis: true
  public_data_only: true
