services:
  - type: web
    name: silencevoice
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 3 --threads 4 --timeout 300 --keep-alive 5 --max-requests 2000 --max-requests-jitter 100 --worker-class sync --preload --access-logfile - --error-logfile - src.dashboard.app:application
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: USE_SUPABASE
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

