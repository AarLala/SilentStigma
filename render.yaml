services:
  - type: web
    name: silencevoice
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('wordnet')"
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300 --keep-alive 5 --max-requests 1000 --max-requests-jitter 50 --access-logfile - --error-logfile - src.dashboard.app:app
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: USE_SUPABASE
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/stats

